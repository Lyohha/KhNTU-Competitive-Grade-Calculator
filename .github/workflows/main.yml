name: "Build"

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

jobs:  
  build:      
    name: Build & Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Login
        run: |
          echo ${{ secrets.PAT }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Build and Publish
        run: |
          docker build . --tag ${{ env.DOCKER_TAG }}
          docker push ${{ env.DOCKER_TAG }}
